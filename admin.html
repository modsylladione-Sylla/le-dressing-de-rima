<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration produits — Le Dressing de Rima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--wine:#6B2737;--wine-dark:#4A1B26;--gold:#C9973F;--sand:#F2E1D3;--ink:#2A2024;--cream:#FBF6EF;--muted:#8a7d78;--radius:8px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Work Sans",sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;}
  header{background:#fff;border-bottom:1px solid rgba(107,39,55,.12);}
  .container{max-width:1120px;margin:0 auto;padding:24px;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  h1,h2{font-family:"Fraunces",serif;color:var(--wine-dark);}
  h1{font-size:28px;}
  h2{font-size:20px;margin-bottom:14px;}
  a{color:var(--wine);font-weight:600;text-decoration:none;}
  .layout{display:grid;grid-template-columns:1fr 1.15fr;gap:22px;margin-top:24px;align-items:start;}
  .panel{background:#fff;border:1px solid rgba(107,39,55,.12);border-radius:var(--radius);padding:20px;}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;}
  input,select,textarea{width:100%;border:1px solid rgba(107,39,55,.2);border-radius:var(--radius);padding:11px 12px;font:inherit;background:#fff;color:var(--ink);}
  textarea{min-height:96px;resize:vertical;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
  button{border:0;border-radius:999px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;}
  .primary{background:var(--wine);color:var(--sand);}
  .secondary{background:var(--sand);color:var(--wine-dark);}
  .danger{background:#f8d7da;color:#842029;}
  .status{margin-top:12px;font-size:13px;color:var(--muted);}
  .token-box{margin-top:16px;background:var(--sand);border-radius:var(--radius);padding:14px;}
  .product-list{display:grid;gap:10px;}
  .product-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid rgba(107,39,55,.1);border-radius:var(--radius);padding:12px;background:#fff;}
  .product-item strong{display:block;font-size:14px;}
  .product-item span{display:block;font-size:13px;color:var(--muted);}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tab{background:#fff;border:1px solid rgba(107,39,55,.18);color:var(--wine);}
  .tab.active{background:var(--wine);color:var(--sand);}
  .empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed rgba(107,39,55,.2);border-radius:var(--radius);}
  @media (max-width:800px){.layout,.row{grid-template-columns:1fr;}.top{align-items:flex-start;flex-direction:column;}}
</style>
</head>
<body>
<header>
  <div class="container top">
    <div>
      <h1>Administration produits</h1>
      <p>Ajoute ou modifie les articles affichés sur la boutique.</p>
    </div>
    <a href="index.html">Retour à la boutique</a>
  </div>
</header>

<main class="container">
  <div class="token-box">
    <label for="admin-token" style="margin-top:0;">Jeton administrateur</label>
    <input id="admin-token" type="password" autocomplete="current-password" placeholder="PRODUCT_ADMIN_TOKEN">
    <p class="status">Le jeton est gardé dans ce navigateur et envoyé uniquement pour enregistrer les changements.</p>
  </div>

  <div class="layout">
    <section class="panel">
      <h2 id="form-title">Nouveau produit</h2>
      <form id="product-form">
        <input type="hidden" id="product-id">
        <div class="row">
          <div>
            <label for="category">Catégorie</label>
            <select id="category" required>
              <option value="habits">Habits</option>
              <option value="accessoires">Accessoires</option>
              <option value="soins">Soins de peau</option>
            </select>
          </div>
          <div>
            <label for="position">Ordre</label>
            <input id="position" type="number" min="0" step="1" value="0">
          </div>
        </div>

        <label for="name">Nom</label>
        <input id="name" required placeholder="Nom du produit">

        <label for="description">Description</label>
        <textarea id="description" placeholder="Description courte"></textarea>

        <div class="row">
          <div>
            <label for="price">Prix</label>
            <input id="price" placeholder="15 000 FCFA">
          </div>
          <div>
            <label for="image">Image</label>
            <input id="image" placeholder="images/produit.jpg">
          </div>
        </div>

        <label for="video">Vidéo</label>
        <input id="video" placeholder="videos/produit.mp4">

        <label>
          <input id="active" type="checkbox" checked style="width:auto;margin-right:8px;">
          Produit visible sur la boutique
        </label>

        <div class="actions">
          <button class="primary" type="submit">Enregistrer</button>
          <button class="secondary" type="button" id="reset-form">Nouveau</button>
        </div>
        <p class="status" id="form-status"></p>
      </form>
    </section>

    <section class="panel">
      <h2>Produits existants</h2>
      <div class="tabs" id="tabs"></div>
      <div class="product-list" id="product-list"></div>
    </section>
  </div>
</main>

<script>
  const categories = [
    { id: "habits", label: "Habits" },
    { id: "accessoires", label: "Accessoires" },
    { id: "soins", label: "Soins de peau" }
  ];
  let currentCategory = "habits";
  let products = { habits: [], accessoires: [], soins: [] };

  const tokenInput = document.getElementById("admin-token");
  tokenInput.value = localStorage.getItem("productAdminToken") || "";
  tokenInput.addEventListener("input", () => localStorage.setItem("productAdminToken", tokenInput.value));

  function setStatus(message) {
    document.getElementById("form-status").textContent = message;
  }

  function escapeHtml(value) {
    return String(value || "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[char]));
  }

  function renderTabs() {
    document.getElementById("tabs").innerHTML = categories.map((category) => `
      <button type="button" class="tab ${category.id === currentCategory ? "active" : ""}" data-category="${category.id}">
        ${category.label}
      </button>
    `).join("");
    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        currentCategory = button.dataset.category;
        render();
      });
    });
  }

  function renderList() {
    const list = products[currentCategory] || [];
    const container = document.getElementById("product-list");
    if (list.length === 0) {
      container.innerHTML = '<div class="empty">Aucun produit dans cette catégorie.</div>';
      return;
    }

    container.innerHTML = list.map((product) => `
      <div class="product-item">
        <div>
          <strong>${escapeHtml(product.nom)}</strong>
          <span>${escapeHtml(product.prix)} · ${product.active ? "visible" : "masqué"}</span>
        </div>
        <button type="button" class="secondary" data-edit="${product.id}">Modifier</button>
      </div>
    `).join("");

    document.querySelectorAll("[data-edit]").forEach((button) => {
      button.addEventListener("click", () => editProduct(Number(button.dataset.edit)));
    });
  }

  function render() {
    renderTabs();
    renderList();
  }

  async function loadProducts() {
    const response = await fetch("/api/products?admin=1");
    if (!response.ok) {
      throw new Error("Impossible de charger les produits.");
    }
    products = await response.json();
    render();
  }

  function editProduct(id) {
    const product = Object.values(products).flat().find((item) => item.id === id);
    if (!product) return;

    document.getElementById("form-title").textContent = "Modifier le produit";
    document.getElementById("product-id").value = product.id;
    document.getElementById("category").value = product.category;
    document.getElementById("position").value = product.position || 0;
    document.getElementById("name").value = product.nom || "";
    document.getElementById("description").value = product.description || "";
    document.getElementById("price").value = product.prix || "";
    document.getElementById("image").value = product.image || "";
    document.getElementById("video").value = product.video || "";
    document.getElementById("active").checked = product.active !== false;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function resetForm() {
    document.getElementById("form-title").textContent = "Nouveau produit";
    document.getElementById("product-form").reset();
    document.getElementById("product-id").value = "";
    document.getElementById("category").value = currentCategory;
    document.getElementById("active").checked = true;
    setStatus("");
  }

  document.getElementById("reset-form").addEventListener("click", resetForm);

  document.getElementById("product-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const id = document.getElementById("product-id").value;
    const body = {
      category: document.getElementById("category").value,
      position: Number(document.getElementById("position").value || 0),
      name: document.getElementById("name").value,
      description: document.getElementById("description").value,
      price: document.getElementById("price").value,
      image: document.getElementById("image").value,
      video: document.getElementById("video").value || null,
      active: document.getElementById("active").checked
    };

    setStatus("Enregistrement...");
    const response = await fetch(`/api/products${id ? `?id=${id}` : ""}`, {
      method: id ? "PUT" : "POST",
      headers: {
        "content-type": "application/json",
        "x-admin-token": tokenInput.value
      },
      body: JSON.stringify(body)
    });

    if (!response.ok) {
      setStatus(response.status === 503 ? "Configure PRODUCT_ADMIN_TOKEN sur Netlify avant d'enregistrer." : "Enregistrement refusé. Vérifie le jeton administrateur.");
      return;
    }

    currentCategory = body.category;
    await loadProducts();
    resetForm();
    setStatus("Produit enregistré.");
  });

  loadProducts().catch((error) => setStatus(error.message));
</script>
</body>
</html>
